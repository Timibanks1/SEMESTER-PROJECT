<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Timi's project</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@vscode/codicons@0.0.35/dist/codicon.css">
  <link rel="stylesheet" href="project.css">
</head>
<body>
<div class="top menu">
  <span class="firstitem">File</span>
  <span class="firstitem">Edit</span>
  <span class="firstitem">Selection</span>
  <span class="firstitem">View</span>
  <span class="firstitem">Go</span>
  <span class="firstitem">Run</span>
  <span class="firstitem">Terminal</span>
  <span class="firstitem">Help</span>
</div>

<div class="app">

  
  <div class="activity-bar">
    <div class="icon active" title="Explorer" onclick="toggleSidebar()">
      <i class="codicon codicon-files"></i>
    </div>
    <div class="icon" title="Search">
      <i class="codicon codicon-search"></i>
    </div>
    <div class="icon" title="Source Control">
      <i class="codicon codicon-source-control"></i>
    </div>
    <div class="icon" title="Run & Debug">
      <i class="codicon codicon-debug-alt"></i>
    </div>
    <div class="icon" title="Settings" style="margin-top:auto;">
      <i class="codicon codicon-settings-gear"></i>
    </div>
  </div>

  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">EXPLORER</div>

    <div class="randomside" onclick="toggleFolder()">
      <span class="arrow open" id="arrow">▶</span>
      <i class="codicon codicon-folder-opened" style="color:#e5c07b"></i>
      <span>PROJECT</span>
    </div>

    <div class="listfile" id="fileList">
      <div class="file active" id="fi-index.html" onclick="openFile('index.html')">
        <i class="codicon codicon-symbol-file" style="color:#e37933"></i>
        index.html
      </div>
      <div class="file" id="fi-styles.css" onclick="openFile('styles.css')">
        <i class="codicon codicon-symbol-file" style="color:#519aba"></i>
        styles.css
      </div>
      <div class="file" id="fi-app.js" onclick="openFile('app.js')">
        <i class="codicon codicon-symbol-file" style="color:#e5c07b"></i>
        app.js
      </div>
      <div class="fi" id="fi-README.md" onclick="openFi('README.md')">

      </div>
    </div>
  </div>


  <div class="main">

    <div class="tabs" id="tabs"></div>

    <div class="editor">
      <div class="lines" id="lines">1</div>
      <div class="code" id="editor" contenteditable="true" spellcheck="false"></div>
    </div>

    <div class="status-bar">
      <span><i class="codicon codicon-source-control"></i> main</span>
      <span id="statusLang">HTML</span>
      <span>CRLF</span>
      <span>UTF-8</span>
      <span id="statusPos">Ln 1, Col 1</span>
      <span><i class="codicon codicon-check"></i> Prettier</span>
    </div>

  </div>
</div>

<script src="app.js"></script>
</body>
</html>
